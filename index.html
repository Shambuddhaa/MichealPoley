<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHAMBUDDHAA SUPREMACY</title>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: 'Comic Sans MS', sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
        }
        h1 {
            color: #00ff00;
            font-size: 2.5rem;
            text-shadow: 2px 2px #ff0000;
        }
        .video-container {
            max-width: 900px;
            margin: 20px auto;
            position: relative;
            border: 5px dashed #ff00ff;
            background: #111;
        }
        video {
            width: 100%;
            height: auto;
            display: block;
        }
        #soundBanner {
            background: #ff0000;
            color: #ffffff;
            padding: 12px;
            font-weight: bold;
            font-size: 1.2rem;
            cursor: pointer;
            border: none;
            width: 100%;
            display: none;
            animation: pulse 1s infinite alternate;
        }
        @keyframes pulse {
            from { background: #ff0000; }
            to { background: #ffff00; color: #000; }
        }
    </style>
</head>
<body>

    <h1>🚨 SHAMBUDDHAA TROLL ZONE 🚨</h1>

    <!-- Unmute prompt if browser forces muted autoplay -->
    <button id="soundBanner" onclick="enableSound()">🔊 TAP SCREEN FOR SOUND! 🔊</button>

    <div class="video-container">
        <!-- 'muted' and 'playsinline' are REQUIRED for SMART Board autoplay -->
        <video id="trollVideo" autoplay muted playsinline controls loop>
            <source src="Shambuddha.mp4" type="video/mp4">
            Your browser does not support video playback.
        </video>
    </div>

    <script>
        const video = document.getElementById('trollVideo');
        const soundBanner = document.getElementById('soundBanner');

        // Function to force unmuted playback upon any user tap
        function enableSound() {
            video.muted = false;
            video.play();
            soundBanner.style.display = 'none';
        }

        window.addEventListener('DOMContentLoaded', () => {
            // Attempt autoplay with sound first
            video.muted = false;
            let playPromise = video.play();

            if (playPromise !== undefined) {
                playPromise.then(() => {
                    // Autoplay with sound succeeded!
                }).catch(error => {
                    // Autoplay with sound was blocked by SMART Board policy
                    // Fallback: Start playing MUTED so it never gets stuck on pause
                    video.muted = true;
                    video.play();
                    soundBanner.style.display = 'block';
                });
            }
        });

        // Enable sound on first touch anywhere on screen
        document.body.addEventListener('touchstart', enableSound, { once: true });
        document.body.addEventListener('click', enableSound, { once: true });
    </script>
</body>
</html>
