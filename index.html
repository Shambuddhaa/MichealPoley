<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔥 SHAMBUDDHAA TROLL PORTAL 🔥</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Impact&family=Outfit:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #09090b;
            color: #f4f4f5;
        }
        .font-impact {
            font-family: 'Impact', sans-serif;
        }
        .pulse-banner {
            animation: pulse-glow 1.5s infinite alternate;
        }
        @keyframes pulse-glow {
            from { transform: scale(1); box-shadow: 0 0 15px #ef4444; }
            to { transform: scale(1.02); box-shadow: 0 0 30px #eab308; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between items-center p-4 sm:p-6 bg-gradient-to-b from-zinc-950 via-zinc-900 to-black select-none">

    <!-- Sound Unmute Banner (Shows if browser blocks unmuted autoplay) -->
    <button id="soundBanner" onclick="enableSound()" class="pulse-banner w-full max-w-2xl bg-gradient-to-r from-red-600 via-amber-500 to-red-600 text-white font-impact tracking-wider text-lg sm:text-xl py-3 px-6 rounded-2xl border-2 border-yellow-300 cursor-pointer shadow-2xl mb-4 transition-all">
        🔊 TAP ANYWHERE ON SCREEN FOR SOUND! 🔊
    </button>

    <main class="w-full max-w-3xl my-auto text-center space-y-6">
        
        <!-- Header / Meme Caption -->
        <div class="space-y-2">
            <div class="inline-block bg-yellow-400 text-black font-black text-xs sm:text-sm px-4 py-1 rounded-full uppercase tracking-widest shadow-md">
                🧪 FICTION DETECTED
            </div>
            <h1 class="font-impact text-3xl sm:text-5xl text-yellow-400 tracking-wide uppercase drop-shadow-[0_4px_10px_rgba(234,179,8,0.3)]">
                "WHEN YOUR LAB REPORT IS A WORK OF PURE FICTION"
            </h1>
            <p class="text-zinc-400 text-sm font-medium">Shambuddhaa Supreme Cut • Streaming Live 1080p 🗿</p>
        </div>

        <!-- Video Player Card -->
        <div class="relative w-full rounded-3xl overflow-hidden border-4 border-yellow-400/80 bg-black shadow-[0_0_50px_rgba(234,179,8,0.15)] aspect-video">
            <video id="trollVideo" class="w-full h-full object-contain" autoplay muted playsinline loop controls poster="https://placehold.co/1280x720/000000/00ff00?text=LOADING+SHAMBUDDHAA.MP4...">
                <source src="Shambuddha.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>

        <!-- Minimal Action Bar -->
        <div class="flex flex-wrap items-center justify-center gap-4 pt-2">
            <button onclick="enableSound()" class="bg-yellow-400 hover:bg-yellow-300 text-black font-impact text-lg px-6 py-3 rounded-2xl shadow-lg transition active:scale-95 flex items-center gap-2">
                <span>🔊 UNMUTE AUDIO</span>
            </button>
            <a href="Shambuddha.mp4" download class="bg-zinc-800 hover:bg-zinc-700 text-yellow-400 font-bold text-base px-6 py-3 rounded-2xl border border-zinc-700 transition active:scale-95 flex items-center gap-2">
                <span>⬇️ DOWNLOAD MP4</span>
            </a>
        </div>

    </main>

    <footer class="w-full text-center text-xs text-zinc-500 font-mono py-4">
        🔥 Hosted on GitHub Pages • Shambuddhaa Meme Network 🔥
    </footer>

    <!-- Smart Autoplay Script -->
    <script>
        const video = document.getElementById('trollVideo');
        const soundBanner = document.getElementById('soundBanner');

        // Function to unmute and ensure playback
        function enableSound() {
            video.muted = false;
            video.play().then(() => {
                soundBanner.style.display = 'none';
            }).catch(err => console.log('Playback error:', err));
        }

        // Attempt autoplay with audio on initial page load
        window.addEventListener('DOMContentLoaded', () => {
            video.muted = false;
            let playPromise = video.play();

            if (playPromise !== undefined) {
                playPromise.then(() => {
                    // Autoplay with audio succeeded! Hide banner.
                    soundBanner.style.display = 'none';
                }).catch(() => {
                    // Browser blocked audio autoplay. Fallback to muted autoplay and show tap banner.
                    video.muted = true;
                    video.play();
                    soundBanner.style.display = 'block';
                });
            }
        });

        // Unmute automatically on first user tap/click anywhere on screen
        document.body.addEventListener('touchstart', enableSound, { once: true });
        document.body.addEventListener('click', enableSound, { once: true });
    </script>
</body>
</html>
