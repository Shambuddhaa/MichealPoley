<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shambuddha Video Hub</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0f6ff',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            900: '#1e3a8a',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #0f172a 60%, #020617 100%);
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glass-button {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .glass-button:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.3);
        }
        .glow-effect {
            box-shadow: 0 0 35px -5px rgba(59, 130, 246, 0.3);
        }
    </style>
</head>
<body class="text-slate-100 flex flex-col justify-between min-h-screen antialiased p-4 sm:p-6 md:p-8">

    <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
        <div class="absolute -top-40 -left-40 w-96 h-96 bg-blue-600/20 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-purple-600/20 rounded-full blur-3xl"></div>
    </div>

    <header class="relative z-10 max-w-5xl mx-auto w-full flex items-center justify-between py-4 mb-4">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center text-white font-bold text-lg shadow-lg">
                <i class="fa-solid font-bold text-sm">S</i>
            </div>
            <div>
                <h1 class="font-bold text-lg leading-tight tracking-tight text-white">Shambuddhaa</h1>
                <p class="text-xs text-slate-400">Media Portal</p>
            </div>
        </div>
        
        <a href="Shambuddha.mp4" download class="glass-button text-xs font-medium px-4 py-2 rounded-xl text-slate-200 hover:text-white transition flex items-center gap-2">
            <i class="fa-solid fa-download text-blue-400"></i>
            <span>Download MP4</span>
        </a>
    </header>

    <main class="relative z-10 max-w-4xl mx-auto w-full my-auto py-4">
        <div class="glass-card rounded-3xl p-4 sm:p-6 md:p-8 shadow-2xl glow-effect transition-all duration-300">
            
            <!-- Video Player Section -->
            <div class="relative w-full rounded-2xl overflow-hidden bg-black/80 aspect-video shadow-inner group border border-slate-800">
                <video id="videoPlayer" class="w-full h-full object-contain" controls preload="metadata" poster="https://placehold.co/1280x720/0f172a/3b82f6?text=Click+to+Play+Shambuddha.mp4">
                    <source src="Shambuddha.mp4" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            </div>

            <!-- Video Metadata & Actions -->
            <div class="mt-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-slate-800/80 pb-6">
                <div>
                    <div class="flex items-center gap-2 mb-1">
                        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-500/10 text-blue-400 border border-blue-500/20">
                            <i class="fa-solid fa-circle text-[8px] mr-1.5 animate-pulse text-blue-400"></i> Active Stream
                        </span>
                        <span class="text-xs text-slate-400">MP4 Video</span>
                    </div>
                    <h2 class="text-xl sm:text-2xl font-bold text-white tracking-tight">Shambuddha.mp4</h2>
                </div>

                <div class="flex items-center gap-2 flex-wrap">
                    <button onclick="playVideo()" class="bg-blue-600 hover:bg-blue-500 text-white text-sm font-semibold px-5 py-2.5 rounded-xl shadow-lg transition duration-200 flex items-center gap-2">
                        <i class="fa-solid fa-play"></i>
                        <span>Play Video</span>
                    </button>
                    <a href="Shambuddha.mp4" target="_blank" class="glass-button text-slate-200 text-sm font-semibold px-4 py-2.5 rounded-xl transition duration-200 flex items-center gap-2">
                        <i class="fa-solid fa-arrow-up-right-from-square text-slate-400"></i>
                        <span>Open Direct Link</span>
                    </a>
                </div>
            </div>

            <!-- Auto Redirect Option Box -->
            <div class="mt-6 bg-slate-900/60 rounded-2xl p-4 border border-slate-800/80 flex flex-col sm:flex-row items-center justify-between gap-4">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 rounded-lg bg-indigo-500/10 border border-indigo-500/20 flex items-center justify-center text-indigo-400 shrink-0">
                        <i class="fa-solid fa-clock-rotate-left"></i>
                    </div>
                    <div>
                        <h3 class="text-sm font-semibold text-slate-200">Automatic File Redirect</h3>
                        <p id="redirectStatusText" class="text-xs text-slate-400">Redirects directly to raw MP4 in <span id="countdown">10</span> seconds</p>
                    </div>
                </div>

                <div class="flex items-center gap-3 w-full sm:w-auto">
                    <button id="cancelRedirectBtn" onclick="cancelRedirect()" class="text-xs font-medium text-slate-400 hover:text-white px-3 py-1.5 rounded-lg hover:bg-slate-800 transition w-full sm:w-auto text-center">
                        Cancel Timer
                    </button>
                    <button onclick="executeRedirect()" class="text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-3.5 py-1.5 rounded-lg transition shrink-0">
                        Redirect Now
                    </button>
                </div>
            </div>

            <!-- Countdown Progress Bar -->
            <div id="progressBarContainer" class="w-full bg-slate-800 rounded-full h-1 mt-3 overflow-hidden">
                <div id="progressBar" class="bg-gradient-to-r from-blue-500 to-indigo-500 h-1 transition-all duration-1000 ease-linear w-full"></div>
            </div>

        </div>
    </main>

    <footer class="relative z-10 max-w-4xl mx-auto w-full mt-6 text-center text-xs text-slate-500 space-y-2">
        <p>Hosted via GitHub Pages • Repository: <code class="bg-slate-900 px-2 py-0.5 rounded text-slate-400">Shambuddhaa/Shambuddhaa.github.io</code></p>
        <p>© <script>document.write(new Date().getFullYear())</script> Shambuddhaa. All rights reserved.</p>
    </footer>

    <script>
        let countdownValue = 10;
        const totalTime = 10;
        let countdownTimer = null;
        let isCancelled = false;

        const countdownEl = document.getElementById('countdown');
        const progressBar = document.getElementById('progressBar');
        const statusText = document.getElementById('redirectStatusText');
        const cancelBtn = document.getElementById('cancelRedirectBtn');
        const videoPlayer = document.getElementById('videoPlayer');

        // Play video helper function
        function playVideo() {
            cancelRedirect();
            if (videoPlayer) {
                videoPlayer.play().catch(err => {
                    console.log('Autoplay prevented or failed:', err);
                });
            }
        }

        // Timer execution
        function startCountdown() {
            countdownTimer = setInterval(() => {
                if (isCancelled) return;

                countdownValue--;
                if (countdownEl) countdownEl.textContent = countdownValue;
                
                // Update progress bar percentage
                const percentage = (countdownValue / totalTime) * 100;
                if (progressBar) progressBar.style.width = percentage + '%';

                if (countdownValue <= 0) {
                    clearInterval(countdownTimer);
                    executeRedirect();
                }
            }, 1000);
        }

        // Cancel redirect function
        function cancelRedirect() {
            isCancelled = true;
            if (countdownTimer) clearInterval(countdownTimer);
            if (statusText) statusText.innerHTML = '<span class="text-amber-400"><i class="fa-solid fa-circle-check mr-1"></i> Automatic redirect paused</span>';
            if (progressBar) progressBar.style.display = 'none';
            if (cancelBtn) cancelBtn.style.display = 'none';
        }

        // Perform redirect to direct MP4 file
        function executeRedirect() {
            window.location.href = 'Shambuddha.mp4';
        }

        // Start countdown on page load
        window.onload = function() {
            startCountdown();
        };
    </script>
</body>
</html>
